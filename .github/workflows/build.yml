name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Runs the backend tests and the frontend tests. Node is downloaded by the Gradle
      # node plugin, so there is no separate setup-node step.
      - name: Build and test
        run: ./gradlew build

      - name: Build container image
        run: docker build -t booking-challenge .
